class-root *{box-sizing:border-box}
.cls-top{display:flex;align-items:center;gap:14px;padding:10px 18px;background:#171a1f;border-bottom:1px solid #262a31;flex:0 0 auto}
.cls-logo{width:34px;height:34px;border-radius:9px;background:#1a73e8;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;color:#fff}
.cls-title{font-size:15px;font-weight:600;letter-spacing:.1px}
.cls-sub{font-size:12px;color:#9aa0a6}
.cls-live{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:12px;color:#9aa0a6}
.cls-dot{width:8px;height:8px;border-radius:50%;background:#ea4335;box-shadow:0 0 0 4px rgba(234,67,53,.15)}
.cls-clock{font-variant-numeric:tabular-nums;color:#e8eaed}
.cls-av{width:30px;height:30px;border-radius:50%;background:#3c4043;color:#e8eaed;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600}
.cls-main{flex:1 1 auto;display:flex;min-height:0}
.cls-stage{flex:1 1 auto;position:relative;display:flex;align-items:center;justify-content:center;background:radial-gradient(80% 80% at 50% 40%,#1b1f26,#0f1115);min-width:0}
.cls-slide{width:min(72%,900px);aspect-ratio:16/9;background:#fbfbfb;border-radius:10px;box-shadow:0 18px 50px rgba(0,0,0,.55);color:#202124;padding:34px 42px;display:flex;flex-direction:column;justify-content:center}
.cls-slide h1{font-size:clamp(16px,2.1vw,30px);margin:0 0 6px;font-weight:700;color:#1a1a1a}
.cls-slide h2{font-size:clamp(11px,1.15vw,17px);margin:0 0 22px;font-weight:500;color:#5f6368}
.cls-slide ul{margin:0;padding-left:20px;color:#3c4043;font-size:clamp(10px,1.05vw,15px);line-height:1.75}
.cls-slide li::marker{color:#1a73e8}
.cls-caption{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.62);padding:7px 14px;border-radius:6px;font-size:12.5px;color:#e8eaed;max-width:70%;text-align:center}
.cls-tiles{position:absolute;right:16px;top:16px;display:grid;grid-template-columns:repeat(2,92px);gap:8px}
.cls-tile{width:92px;height:62px;border-radius:8px;background:#20242b;border:1px solid #2c313a;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:#bdc1c6}
.cls-tile.me{background:#243447;border-color:#3b6ea8}
.cls-bar{display:flex;align-items:center;justify-content:center;gap:12px;padding:12px;background:#171a1f;border-top:1px solid #262a31;flex:0 0 auto}
.cls-btn{width:44px;height:44px;border-radius:50%;border:0;background:#2b2f36;color:#e8eaed;display:flex;align-items:center;justify-content:center;cursor:pointer}
.cls-btn svg{width:20px;height:20px;fill:#e8eaed}
.cls-btn.end{background:#ea4335;width:58px;border-radius:22px}
.cls-btn.end svg{fill:#fff}
.cls-side{width:288px;flex:0 0 288px;background:#171a1f;border-left:1px solid #262a31;display:flex;flex-direction:column;min-height:0}
.cls-side h3{margin:0;padding:14px 16px 10px;font-size:13px;font-weight:600;color:#e8eaed}
.cls-chat{flex:1 1 auto;overflow:hidden;padding:0 16px;display:flex;flex-direction:column;gap:12px}
.cls-msg{display:flex;gap:9px;font-size:12.5px;line-height:1.45}
.cls-msg .a{width:26px;height:26px;border-radius:50%;flex:0 0 26px;display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:700;color:#fff}
.cls-msg b{display:block;font-size:12px;color:#e8eaed;font-weight:600}
.cls-msg span{color:#bdc1c6}
.cls-input{margin:12px 16px 16px;padding:9px 12px;border-radius:18px;background:#20242b;color:#9aa0a6;font-size:12.5px;border:1px solid #2c313a}
.cls-veil{position:fixed;inset:0;background:rgba(8,10,14,.72);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;z-index:20}
.cls-card{background:#161a21;border:1px solid #2a303a;border-radius:16px;padding:26px 30px;text-align:center;box-shadow:0 24px 60px rgba(0,0,0,.6)}
.cls-card p{margin:0 0 16px;font-size:18px;font-weight:600;letter-spacing:.2px;color:#e8eaed}
.cls-card button{border:0;border-radius:10px;padding:11px 20px;font-size:14px;font-weight:600;background:#1a73e8;color:#fff;cursor:pointer;font-family:inherit}
.cls-card small{display:block;margin-top:12px;color:#7f858d;font-size:11.5px}
@media (max-width:900px){.cls-side{display:none}.cls-tiles{display:none}}

