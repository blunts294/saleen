<style>
html,body{margin:0;height:100%;background:#04121c;overflow:hidden;border:0;outline:0}
iframe{position:fixed;inset:0;width:100%;height:100%;border:0;display:block;background:#04121c}

<body>
<iframe id="saleen" title="Saleen" allow="autoplay; fullscreen; encrypted-media; picture-in-picture" allowfullscreen="allowfullscreen"></iframe>
<script type="text/javascript">
//<![CDATA[
(function () {
  var frame = document.getElementById('saleen');
  if (!frame) return;
  /* Same app, different hosts. A network filter that blocks one mirror (or
     shows its own block page) never answers "saleen:ready", so the wrapper
     moves to the next copy instead of leaving a dead frame on screen. */
  var sources = [
    'https://blunts294.github.io/saleen/index.html',
    'https://raw.githack.com/blunts294/saleen/main/index.html',
    'https://blunts294.github.io/saleen/index.xhtml'
  ];
  var at = 0, timer = null, done = false;
  function next() {
    if (done || at >= sources.length) return;
    var base = sources[at++];
    frame.src = base + (base.indexOf('?') >= 0 ? '&' : '?') + 't=' + new Date().getTime();
    window.clearTimeout(timer);
    timer = window.setTimeout(next, 9000);
  }
  window.addEventListener('message', function (e) {
    if (e.data === 'saleen:ready') { done = true; window.clearTimeout(timer); }
  });
  next();
})();
//]]>
</script>
</body>
